<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tableau de bord du service — Pharmacie clinique</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="eff-wrap" id="app">
  <form class="eff-lock" id="lock">
    <p class="eff-kicker">Le pharmacien clinicien au service de l’efficience</p>
    <h1 id="svc-name">Tableau de bord du service</h1>
    <p class="eff-small">Ces données sont réservées au service. Saisissez le mot de passe transmis par la pharmacie.</p>
    <label class="eff-field">Mot de passe<input class="eff-input" type="password" id="pwd" autocomplete="current-password" required></label>
    <button class="eff-btn" type="submit" id="go">Ouvrir</button>
    <p class="eff-err" id="err" role="alert"></p>
    <p class="eff-small"><a href="./">Retour à l’accueil</a></p>
  </form>
</main>
<script src="assets/core.js"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get('s') || '';
  const err = document.getElementById('err');
  const safe = /^[a-z0-9-]{1,40}$/.test(id);
  let manifest = null;
  try { manifest = await (await fetch('data/manifest.json?t=' + Date.now(), {cache: 'no-store'})).json(); } catch (e) {}
  const entry = manifest && safe ? (manifest.services || []).find((s) => s.id === id) : null;
  if (entry) { document.getElementById('svc-name').textContent = entry.nom; document.title = entry.nom + ' — Pharmacie clinique'; }
  else { err.textContent = 'Service introuvable. Vérifiez le lien reçu.'; document.getElementById('go').disabled = true; return; }
  document.getElementById('lock').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = '';
    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Déchiffrement…';
    try {
      const env = await (await fetch('data/' + id + '.enc.json?t=' + Date.now(), {cache: 'no-store'})).json();
      let data;
      try { data = await EFF.decrypt(env, document.getElementById('pwd').value); }
      catch (e) { throw new Error('Mot de passe incorrect.'); }
      const app = document.getElementById('app');
      EFF.renderDashboard(app, data);
      app.append(EFF.el('footer', {class: 'eff-foot'}, 'Données confidentielles, réservées au service. ', EFF.el('a', {href: './', text: 'Accueil'}), ' · ', EFF.el('a', {href: '#', text: 'Imprimer', onclick: (e) => { e.preventDefault(); print(); }})));
      document.title = data.service + ' — Pharmacie clinique';
    } catch (e) {
      err.textContent = e.message || 'Impossible de charger les données.';
      btn.disabled = false; btn.textContent = 'Ouvrir';
    }
  });
})();
</script>
</body>
</html>
