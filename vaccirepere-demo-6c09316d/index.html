<title>VacciRepère Adulte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Plan : un passeport qu'on remplit de tampons. Colonne unique mobile, une question par écran,
   barre de progression en forme de seringue, résultats = tampons encreurs. */
/* Plan : sobriété des documents publics de santé (bleu France, rouge Marianne, angles nets, fond blanc),
   avec une touche ludique conservée : la seringue de progression et les tampons du passeport. */
:root{
  --paper:#FFFFFF;
  --card:#F6F6F6;
  --ink:#161616;
  --muted:#4F4F4F;
  --line:#DDDDDD;
  --blue:#000091;    /* bleu France : titres, boutons */
  --stamp:#E1000F;   /* rouge Marianne : à faire */
  --sun:#B34000;     /* à discuter */
  --sky:#0063CB;     /* à prévoir */
  --leaf:#18753C;    /* à jour */
  --tint:#E3E3FD;
  --font-display:"Source Sans 3", Arial, "Helvetica Neue", sans-serif;
  --font-body:"Source Sans 3", Arial, "Helvetica Neue", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161616; --card:#1E1E1E; --ink:#F0F0F0; --muted:#BDBDBD; --line:#353535;
    --blue:#8585F6; --stamp:#FF5655; --sun:#FF7A55; --sky:#518FFF; --leaf:#27A658; --tint:#1B1B35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161616; --card:#1E1E1E; --ink:#F0F0F0; --muted:#BDBDBD; --line:#353535;
  --blue:#8585F6; --stamp:#FF5655; --sun:#FF7A55; --sky:#518FFF; --leaf:#27A658; --tint:#1B1B35;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:18px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
h1,h2,h3{color:var(--blue);font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #0A76F6;outline-offset:3px;border-radius:4px}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.brand{color:var(--blue);display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand svg{flex:none}
.brand .adult{font-family:var(--font-body);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--stamp);border-radius:4px;padding:3px 6px 3px 8px;line-height:1}
.brand .tag{font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--muted);margin-left:2px}
@media (max-width:440px){.brand .tag{display:none}}
.top:has(.back) .brand .tag{display:none}
.back{white-space:nowrap}
.back{margin-left:auto;background:none;border:1px solid var(--blue);border-radius:4px;padding:6px 14px;font-size:15px;color:var(--blue)}
.back:hover{background:var(--tint)}

/* ---- syringe progress ---- */
.syringe{display:flex;align-items:center;gap:0;height:26px}
.syr-plunger{width:14px;height:22px;border:2.5px solid var(--blue);border-right:none;border-radius:4px 0 0 4px}
.syr-rod{height:4px;background:var(--blue);transition:width .5s ease}
.syr-barrel{flex:1;height:22px;border:2.5px solid var(--blue);border-radius:6px;position:relative;overflow:hidden;background:var(--card)}
.syr-fill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--blue) 0 calc(10% - 2px),transparent calc(10% - 2px) 10%);opacity:.9;transition:width .5s ease}
.syr-tip{width:14px;height:8px;background:var(--blue);border-radius:0 2px 2px 0}
.syr-needle{width:26px;height:2px;background:var(--muted)}
.step-count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}

/* ---- screens ---- */
.screen{display:flex;flex-direction:column;gap:18px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.q{font-size:clamp(28px,7.5vw,36px);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:17px;max-width:62ch}

/* ---- welcome ---- */
.hero{display:flex;flex-direction:column;gap:20px;padding-top:18px}
.hero h1{font-size:clamp(34px,9.5vw,46px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--stamp)}
.hero h1{border-left:5px solid var(--stamp);padding-left:12px}
.passport{position:relative;background:var(--blue);color:#fff;border-radius:4px;padding:22px 20px 20px;overflow:hidden;min-height:170px}
.passport .pp-title{font-family:var(--font-display);font-weight:800;letter-spacing:.18em;font-size:13px;text-transform:uppercase;opacity:.75}
.passport .pp-name{font-family:var(--font-display);font-weight:800;font-size:24px;margin-top:6px}
.passport .pp-lines{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-width:55%}
.passport .pp-lines span{display:block;height:6px;border-radius:3px;background:currentColor;opacity:.18}
.mini-stamp{position:absolute;font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border:2.5px solid;border-radius:8px;box-shadow:inset 0 0 0 2px var(--blue),inset 0 0 0 3.5px currentColor;background:var(--blue)}
.ms1{right:16px;top:58px;color:#FF8D8D;transform:rotate(9deg)}
.ms2{right:96px;top:104px;color:#5FD9A2;transform:rotate(-7deg)}
.ms3{right:12px;top:126px;color:#FFCA00;transform:rotate(4deg)}
.facts-line{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--muted);font-weight:700}
.facts-line span{display:flex;align-items:center;gap:7px}
.facts-line span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--leaf)}
.hero-foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.hero-foot .source{font-size:14px;color:var(--muted)}
.mention-light{font-size:13px;color:var(--muted);line-height:1.45}
.mention-light b{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--tint);color:var(--blue);font-weight:700;border:none;border-radius:4px;padding:6px 12px;font-size:15px}
.cta{background:var(--blue);color:#fff;border:none;border-radius:4px;padding:18px 22px;font-family:var(--font-display);font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background .15s}
.cta:hover{background:#1212FF}.cta:active{transform:translateY(1px)}
.cta[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
.fine{font-size:14px;color:var(--muted)}
.source{font-size:15px;color:var(--ink)}
.source a{color:var(--blue);font-weight:700}
.mention{border:1.5px solid var(--line);border-left:5px solid var(--muted);border-radius:4px;padding:12px 14px;background:var(--card);font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mention b{color:var(--ink);font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* ---- option tiles ---- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:1px solid var(--line);border-bottom:3px solid var(--blue);border-radius:4px;padding:14px 16px;min-height:64px;transition:border-color .15s, transform .08s, background .15s}
.opt:hover{background:var(--card)}
.opt:active{transform:scale(.985)}
.opt .ico{flex:none;width:42px;height:42px;border-radius:4px;background:var(--tint);display:grid;place-items:center}
.opt .lbl{font-weight:700;font-size:18px;line-height:1.2}
.opt .lbl small{display:block;font-weight:400;font-size:15px;color:var(--muted);margin-top:2px}
.opt.yes .ico{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}
.opt.no .ico{background:color-mix(in srgb,var(--stamp) 15%,transparent);color:var(--stamp)}
.opt.unsure .ico{background:color-mix(in srgb,var(--sun) 22%,transparent);color:var(--sun)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--tint)}

/* chips (multi) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:11px 14px;text-align:left;font-size:16px;line-height:1.25;display:flex;gap:10px;align-items:flex-start;flex:1 1 230px}
.chip .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.chip b{display:block}

@keyframes slam{0%{transform:rotate(-6deg) scale(2);opacity:0}60%{opacity:1}100%{transform:rotate(-6deg) scale(1);opacity:1}}

/* where to get vaccinated */

.caution{font-size:15px;line-height:1.4;background:color-mix(in srgb,var(--sun) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--sun) 45%,transparent);border-left:4px solid var(--sun);border-radius:4px;padding:10px 12px}

.brandkit{display:flex;flex-direction:column;gap:12px;margin-top:10px;padding-top:16px;border-top:1px solid var(--line)}
.bk-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.others{font-size:15px;color:var(--muted);border-left:3px solid var(--blue);padding:4px 0 4px 12px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pro .can{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.pro.best{border:2px solid var(--blue)}
.pro .badge{justify-self:start;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--blue);color:#fff;border-radius:6px;padding:2px 7px}
.tip{background:var(--tint);border-radius:4px;padding:12px 14px;font-size:15px}
.tip b{font-family:var(--font-display)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.ghost{background:var(--paper);color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:12px 16px;font-weight:700;font-size:16px;flex:1 1 180px}

.legal{font-size:13px;color:var(--muted);border-top:1.5px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 16px;border-radius:4px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.fiche-cta{margin-top:4px}
.sheet{background:#fff;color:#161616;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08);padding:18px;font-size:14px;line-height:1.35;display:flex;flex-direction:column;gap:10px}
.sheet .sh-head{background:#000091;color:#fff;margin:-18px -18px 0;padding:12px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sheet .sh-head b{font-size:17px}
.sheet h5{margin:6px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#000091;border-bottom:1.5px solid #000091;padding-bottom:3px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet td{padding:5px 6px;border-bottom:1px solid #E5E5E5;vertical-align:top}
.sheet td:first-child{font-weight:700;width:30%}
.sheet td.when{color:#E1000F;font-weight:700;width:27%}
.sheet tr.ok td.when{color:#18753C}
.sheet .sh-foot{font-size:11px;color:#4F4F4F;border-top:1px solid #DDD;padding-top:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:16px}
.field input{font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-bottom:3px solid var(--blue);border-radius:4px 4px 0 0;background:var(--card);color:var(--ink)}
.send{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;border-radius:4px}

@media (min-width:520px){ .where{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

<body>
<main class="app" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>

<script>
// ====================== RULES-START (calendrier des vaccinations 2026) ======================
const LIFE_RISK = ["resp","cardio","diabete","rein","foie","immuno","asplenie","obesite","neuro"];

// ⚠️ À METTRE À JOUR CHAQUE ANNÉE : dates officielles de la campagne grippe / Covid-19 (DGS-Urgent de septembre).
const CAMPAGNE = {
  label: "2026-2027",
  ouverture: "2026-10-13",          // ouverture de la campagne (France hexagonale)
  ouvertureTxt: "13 octobre 2026",
  fin: "2027-01-31"                 // fin de la campagne grippe
};

function seasonInfo(now){
  const t = now.toISOString().slice(0,10);
  const m = now.getMonth()+1;
  return {
    m,
    flu: t >= CAMPAGNE.ouverture && t <= CAMPAGNE.fin,   // campagne en cours
    label: CAMPAGNE.label,
    since: CAMPAGNE.ouvertureTxt,
    spring: (m>=4 && m<=6)
  };
}

function pron(s){
  if(s.who==="moi") return {avez:"Avez-vous", etes:"Êtes-vous", vous:"vous", votre:"votre", age:"Quel âge avez-vous ?"};
  if(s.who==="enfant") return {avez:"Votre enfant a-t-il", etes:"Votre enfant est-il", vous:"votre enfant", votre:"son", age:"Quel âge a votre enfant ?"};
  return {avez:"Votre proche a-t-il", etes:"Votre proche est-il", vous:"votre proche", votre:"son", age:"Quel âge a votre proche ?"};
}

function flags(s){
  const c = k => s.conds.includes(k);
  const l = k => s.life.includes(k);
  const unsure = c("unsure");
  const any = arr => arr.some(c) || unsure;
  return {
    c, l, unsure,
    immuno: c("immuno"),
    riskFlu: any(LIFE_RISK),
    riskCovid: any([...LIFE_RISK,"psy","t21"]),
    riskPneumo: any(["immuno","asplenie","resp","cardio","rein","foie","diabete"]),
    riskRsv: c("resp") || c("cardio") || unsure,
    preg: s.preg==="yes",
    pregMaybe: s.preg==="maybe",
    stage: s.pregStage,                 // "lt20" | "20_31" | "32_36" | "37p"
  };
}

// Questions à poser, construites selon le profil et les réponses déjà données
function vaccineQuestions(s, now){
  const P = pron(s), F = flags(s), A = s.age, S = seasonInfo(now), a = s.answers;
  const Q = [];
  const yn = (extra) => extra || [
    {v:"yes",label:"Oui",cls:"yes"},
    {v:"no",label:"Non",cls:"no"},
    {v:"unsure",label:"Je ne sais pas",cls:"unsure"}];

  if(A < 11){
    if(A <= 1) Q.push({id:"carnet", vac:"Vaccins du bébé", dis:"11 vaccins obligatoires + rotavirus",
      q:`Les vaccins de votre bébé sont-ils à jour dans son carnet de santé ?`,
      sub:"Rendez-vous à 2, 3, 4, 5, 6, 11, 12 et 16–18 mois.", opts:yn()});
    if(A === 0) Q.push({id:"beyfortus", vac:"Bronchiolite (VRS)", dis:"Anticorps Beyfortus",
      q:`Votre bébé a-t-il reçu Beyfortus contre la bronchiolite ?`,
      sub:"Une injection d'anticorps, souvent faite à la maternité.",
      opts:[{v:"yes",label:"Oui",cls:"yes"},{v:"mum",label:"Non, mais j'ai eu le vaccin Abrysvo enceinte",cls:"yes"},{v:"no",label:"Non",cls:"no"},{v:"unsure",label:"Je ne sais pas",cls:"unsure"}]});
    if(A >= 2 && A <= 4) Q.push({id:"menkid", vac:"Méningocoques ACWY et B", dis:"Méningites et septicémies",
      q:`Votre enfant a-t-il reçu les vaccins contre les méningocoques ACWY et B ?`,
      sub:"Même s'il a eu le vaccin contre le méningocoque C, un rattrapage est prévu jusqu'à 5 ans.", opts:yn()});
    if(A >= 2) Q.push({id:"ror", vac:"ROR", dis:"Rougeole, oreillons, rubéole",
      q:`Votre enfant a-t-il reçu 2 doses de vaccin ROR ?`, sub:"Normalement à 12 mois et entre 16 et 18 mois.", opts:yn()});
    if(A >= 2) Q.push({id:"hepb", vac:"Hépatite B", dis:"Infection du foie",
      q:`Votre enfant est-il vacciné contre l'hépatite B ?`, sub:"Souvent inclus dans le vaccin « 6 en 1 » du nourrisson.", opts:yn()});
    if(A >= 6) Q.push({id:"dtp6", vac:"DTCaP", dis:"Diphtérie, tétanos, coqueluche, polio",
      q:`Votre enfant a-t-il eu son rappel des 6 ans (DTCaP) ?`, sub:"Diphtérie, tétanos, coqueluche et poliomyélite.", opts:yn()});
    if(S.flu && (A >= 2 || (A === 1 && F.riskFlu))) Q.push({id:"flu", vac:"Grippe", dis:`Campagne ${S.label}`,
      q:`Votre enfant a-t-il été vacciné contre la grippe depuis le ${S.since} ?`, sub:`Ouverture de la campagne ${S.label} : ${S.since}.`, opts:yn()});
    if(S.flu && A >= 1 && F.riskCovid){
      Q.push({id:"covid", vac:"Covid-19", dis:`Campagne ${S.label}`,
        q:`Votre enfant a-t-il reçu un vaccin Covid-19 depuis le ${S.since} ?`, sub:`Ouverture de la campagne ${S.label} : ${S.since}.`, opts:yn()});
      if(a.covid && a.covid !== "yes") Q.push({id:"covidrecent", vac:"Covid-19", dis:"Infection ou vaccin récent",
        q:`Votre enfant a-t-il eu le Covid ou un vaccin Covid au cours des 6 derniers mois ?`, sub:"Dans ce cas, le vaccin se fait 6 mois après.",
        opts:[{v:"yes",label:"Oui, il y a moins de 6 mois",cls:"yes"},{v:"no",label:"Non",cls:"no"},{v:"unsure",label:"Je ne sais pas",cls:"unsure"}]});
    }
    return Q;
  }

  // ----- 11 ans et plus -----
  // DTP / coqueluche
  if(!F.preg){
    const ms = [11,25,45,65,75,85,95,105];
    const M = ms.filter(x => x <= A).pop();
    let sub = "Le dernier rappel est noté dans le carnet de santé ou de vaccination.";
    if(M===11) sub = "Rappel prévu entre 11 et 13 ans (avec la coqueluche).";
    if(M===25) sub = "Le rappel de 25 ans protège aussi contre la coqueluche. Un rappel fait peu avant 25 ans compte.";
    if(M===45) sub = "Rappel prévu à 45 ans (avec la coqueluche).";
    if(M>=65) sub = "Après 65 ans, un rappel tous les 10 ans.";
    Q.push({id:"dtp", vac:"DTP-coqueluche", dis:"Diphtérie, tétanos, polio, coqueluche",
      q:`${P.avez} eu un rappel diphtérie-tétanos-polio depuis l'âge de ${M} ans ?`, sub, opts:yn()});
    if(F.l("bebe") && a.dtp === "yes") Q.push({id:"coq5", vac:"Coqueluche", dis:"Protéger le bébé",
      q:`${P.avez} reçu un vaccin contre la coqueluche il y a moins de 5 ans ?`,
      sub:"La coqueluche est très grave pour les nourrissons : l'entourage se protège pour les protéger.", opts:yn()});
  } else if(F.stage && F.stage !== "lt20"){
    Q.push({id:"coqpreg", vac:"Coqueluche", dis:"Pendant la grossesse",
      q:`Avez-vous déjà reçu le vaccin contre la coqueluche pendant cette grossesse ?`,
      sub:"Il protège votre bébé dès la naissance, grâce à vos anticorps.", opts:yn()});
  }
  // ROR
  if(A <= 46 || F.l("prosante") || F.l("petiteenfance")){
    Q.push({id:"ror", group:"Vaccins de l'enfance", vac:"ROR", dis:"Rougeole, oreillons, rubéole",
      q: A <= 46 ? `${P.avez} reçu 2 doses de vaccin ROR ?` : `${P.avez} reçu au moins 1 dose de vaccin contre la rougeole ?`,
      sub: A <= 46 ? "Pour toutes les personnes nées depuis 1980. Vérifiez le carnet de santé." : "Pour les professionnels de santé et de la petite enfance qui n'ont jamais eu la rougeole.",
      opts:yn()});
  }
  // HPV
  if(A <= 26) Q.push({id:"hpv", group:"Vaccins de l'enfance et de l'adolescence", vac:"Papillomavirus (HPV)", dis:"Prévention de plusieurs cancers",
    q:`${P.avez} terminé la vaccination contre les papillomavirus ?`,
    sub:"Pour les filles et les garçons. Protège contre des cancers du col de l'utérus, de la gorge, de l'anus…",
    opts:[{v:"yes",label:"Oui, toutes les doses",cls:"yes"},{v:"no",label:"Non, ou pas toutes",cls:"no"},{v:"unsure",label:"Je ne sais pas",cls:"unsure"}]});
  // Méningocoque ACWY
  if(A <= 24) Q.push({id:"acwy", group:"Vaccins de l'adolescence", vac:"Méningocoques ACWY", dis:"Méningites et septicémies",
    q:`${P.avez} reçu un vaccin méningocoque ACWY depuis l'âge de 11 ans ?`,
    sub:"Recommandé entre 11 et 14 ans, même après un vaccin contre le méningocoque C. Rattrapage jusqu'à 24 ans.", opts:yn()});
  // Hépatite B (vaccin de l'enfance, vérifié chez tous les adultes)
  Q.push({id:"hepb", group:"Vaccins de l'enfance", vac:"Hépatite B", dis:"Infection du foie",
    q: s.who==="moi" ? "Avez-vous été vacciné(e) contre l'hépatite B ?" : "Votre proche a-t-il été vacciné contre l'hépatite B ?",
    sub:"Souvent fait dans l'enfance (vaccin du nourrisson) ou au collège. Vérifiez le carnet de santé.", opts:yn()});
  // Varicelle
  if(A <= 49 || F.l("prosante") || F.l("petiteenfance") || F.l("fragile")) Q.push({id:"vzv", group:"Maladies de l'enfance", vac:"Varicelle", dis:"Maladie ou vaccin",
    q: s.who==="moi" ? "Avez-vous déjà eu la varicelle ou le vaccin contre la varicelle ?" : "Votre proche a-t-il déjà eu la varicelle ou le vaccin ?",
    sub:"La plupart des adultes l'ont eue enfant. Sans antécédent, le vaccin peut être recommandé.", opts:yn()});
  // Grippe
  if(fluIndicated(s, F) && S.flu) Q.push({id:"flu", vac:"Grippe", dis:`Campagne ${S.label}`,
    q:`${P.avez} été vacciné(e) contre la grippe depuis le ${S.since} ?`.replace("a-t-il été vacciné(e)","a-t-il été vacciné"),
    sub:`La campagne ${S.label} a ouvert le ${S.since}. Un vaccin fait avant cette date ne protège pas pour cet hiver.`, opts:yn()});
  // Covid
  if(covidIndicated(s, F) && S.flu){
    Q.push({id:"covid", vac:"Covid-19", dis:`Campagne ${S.label}`,
      q:`${P.avez} reçu un vaccin Covid-19 depuis le ${S.since} ?`, sub:`Ouverture de la campagne ${S.label} : ${S.since}.`, opts:yn()});
    if(a.covid && a.covid !== "yes"){
      const d = covidDelay(s, F);
      Q.push({id:"covidrecent", vac:"Covid-19", dis:"Infection ou vaccin récent",
        q:`${P.avez} eu le Covid ou un vaccin Covid au cours des ${d} derniers mois ?`.replace("a-t-il eu","a-t-il eu"),
        sub:`Un Covid confirmé (test positif) ou une dose de vaccin il y a moins de ${d} mois protège encore : le vaccin se fait ${d} mois après.`,
        opts:[{v:"yes",label:`Oui, il y a moins de ${d} mois`,cls:"yes"},{v:"no",label:"Non",cls:"no"},{v:"unsure",label:"Je ne sais pas",cls:"unsure"}]});
    }
  }
  // Pneumocoque
  if(A >= 65 || (A >= 18 && F.riskPneumo)) Q.push({id:"pneumo", vac:"Pneumocoque", dis:"Pneumonies et méningites",
    q:`${P.avez} déjà reçu un vaccin contre le pneumocoque ?`, sub:"Une seule dose suffit désormais avec les vaccins récents.",
    opts:[{v:"yes",label:"Oui, Capvaxive ou Prevenar 20",cls:"yes"},{v:"old",label:"Oui, un ancien vaccin",cls:"unsure",small:"Prevenar 13, Pneumovax, Vaxneuvance"},{v:"no",label:"Non",cls:"no"},{v:"unsure",label:"Je ne sais pas",cls:"unsure"}]});
  // Zona
  if(A >= 65 || (A >= 18 && F.immuno)) Q.push({id:"zona", vac:"Zona", dis:"Vaccin Shingrix",
    q:`${P.avez} reçu les 2 doses du vaccin Shingrix contre le zona ?`, sub:"Recommandé même si vous avez déjà eu un zona. L'ancien vaccin Zostavax ne compte pas.",
    opts:[{v:"yes",label:"Oui, les 2 doses",cls:"yes"},{v:"one",label:"Une seule dose",cls:"unsure"},{v:"no",label:"Non",cls:"no"},{v:"unsure",label:"Je ne sais pas",cls:"unsure"}]});
  // VRS adulte
  if(A >= 75 || (A >= 65 && F.riskRsv)) Q.push({id:"rsv", vac:"VRS", dis:"Virus respiratoire syncytial",
    q:`${P.avez} déjà reçu un vaccin contre le VRS ?`, sub:"Arexvy, Abrysvo ou mResvia. Une seule dose pour l'instant.", opts:yn()});
  return Q;
}

function covidDelay(s, F){
  return (s.age >= 80 || F.immuno || F.l("ehpad")) ? 3 : 6;
}
function fluIndicated(s, F){
  const A = s.age;
  return A >= 65 || F.preg || F.riskFlu || F.l("ehpad") || F.l("fragile") || F.l("prosante") || A <= 17;
}
function covidIndicated(s, F){
  const A = s.age;
  return A >= 65 || F.preg || F.riskCovid || F.l("ehpad") || F.l("fragile") || F.l("prosante");
}

// Résultats : status = todo | later | discuss | ok
function computeResults(s, now){
  const F = flags(s), A = s.age, S = seasonInfo(now);
  const a = Object.assign({}, s.answers, {_covidDelay: A < 11 ? 6 : covidDelay(s, F)});
  const R = [];
  const add = (o) => R.push(Object.assign({doubt:false, live:false, why:""}, o));
  const doubt = id => a[id] === "unsure";

  if(A < 11){
    if(A <= 1){
      const sched = "2 mois : 6 en 1 (diphtérie, tétanos, coqueluche, polio, Hib, hépatite B) + pneumocoque + rotavirus · 3 mois : méningocoque B + rotavirus · 4 mois : 6 en 1 + pneumocoque · 5 mois : méningocoque B · 6 mois : méningocoque ACWY · 11 mois : 6 en 1 + pneumocoque · 12 mois : ROR + méningocoques ACWY et B · 16–18 mois : ROR.";
      if(a.carnet === "yes") add({id:"carnet", name:"Vaccins du bébé", dis:"Calendrier du nourrisson", status:"ok", how:"Continuez le calendrier aux prochains rendez-vous.", why:sched});
      else add({id:"carnet", name:"Vaccins du bébé", dis:"Calendrier du nourrisson", status:"todo", doubt:doubt("carnet"), how:"Faites vérifier le carnet : un rattrapage est possible pour chaque vaccin manquant.", why:sched});
    }
    if(A === 0){
      if(a.beyfortus === "yes" || a.beyfortus === "mum") add({id:"beyfortus", name:"Bronchiolite (VRS)", dis:"Beyfortus", status:"ok", how: a.beyfortus==="mum" ? "Votre vaccin pendant la grossesse protège votre bébé." : "Votre bébé est protégé pour cette saison."});
      else add({id:"beyfortus", name:"Bronchiolite (VRS)", dis:"Anticorps Beyfortus", status:"todo", doubt:doubt("beyfortus"), how:"1 injection recommandée pendant la première année, avant ou pendant la saison de la bronchiolite."});
    }
    if(A >= 2 && A <= 4){
      if(a.menkid === "yes") add({id:"menkid", name:"Méningocoques ACWY et B", dis:"Méningites", status:"ok", how:"À jour."});
      else add({id:"menkid", name:"Méningocoques ACWY et B", dis:"Méningites", status:"todo", doubt:doubt("menkid"), how:"Rattrapage ACWY et B jusqu'à 5 ans, même après un vaccin contre le méningocoque C.", why:"Obligatoire pour les enfants nés depuis 2023 qui n'étaient pas vaccinés à 2 ans."});
    }
    if(A >= 2){
      if(a.ror === "yes") add({id:"ror", name:"ROR", dis:"Rougeole, oreillons, rubéole", status:"ok", how:"2 doses : protection à vie."});
      else if(F.immuno) add({id:"ror", name:"ROR", dis:"Rougeole, oreillons, rubéole", status:"discuss", live:true, doubt:doubt("ror"), how:"Vaccin vivant : à décider avec le médecin qui suit votre enfant (contre-indiqué si l'immunité est affaiblie)."});
      else add({id:"ror", name:"ROR", dis:"Rougeole, oreillons, rubéole", status:"todo", live:true, doubt:doubt("ror"), how:"Compléter jusqu'à 2 doses au total, à au moins 1 mois d'intervalle."});
      if(a.hepb === "yes") add({id:"hepb", name:"Hépatite B", dis:"Foie", status:"ok", how:"À jour."});
      else add({id:"hepb", name:"Hépatite B", dis:"Foie", status:"todo", doubt:doubt("hepb"), how:"Rattrapage possible jusqu'à 15 ans."});
    }
    if(A >= 6){
      if(a.dtp6 === "yes") add({id:"dtp", name:"DTCaP", dis:"Diphtérie, tétanos, coqueluche, polio", status:"ok", how:"Prochain rappel entre 11 et 13 ans."});
      else add({id:"dtp", name:"DTCaP", dis:"Diphtérie, tétanos, coqueluche, polio", status:"todo", doubt:doubt("dtp6"), how:"Rappel des 6 ans à faire."});
    } else if(A >= 2){
      add({id:"dtp", name:"DTCaP", dis:"Diphtérie, tétanos, coqueluche, polio", status:"later", how:"Prochain rappel à 6 ans."});
    }
    // Grippe enfant
    const fluKid = A >= 2 || (A === 1 && F.riskFlu);
    if(fluKid) pushSeasonal(add, a, "flu", "Grippe", S,
      A >= 2 && !F.riskFlu ? "Proposée à tous les enfants de 2 à 17 ans." : "Recommandée pour votre enfant en raison de sa santé.",
      "1 dose chaque automne (2 doses la première fois avant 9 ans).");
    else if(A === 0 && F.riskFlu) add({id:"flu", name:"Grippe", dis:"Dès 6 mois", status:"discuss", how:"Possible dès 6 mois pour les bébés à risque : parlez-en au médecin.", doubt:F.unsure});
    if(A >= 1 && F.riskCovid) pushSeasonal(add, a, "covid", "Covid-19", S, "Recommandé pour les enfants à risque de forme grave.", "Schéma adapté par le médecin.");
    else if(A === 0 && F.riskCovid) add({id:"covid", name:"Covid-19", dis:"Dès 6 mois", status:"discuss", how:"Possible dès 6 mois pour les bébés à risque : parlez-en au médecin.", doubt:F.unsure});
    if(A >= 2 && F.riskPneumo) add({id:"pneumo", name:"Pneumocoque", dis:"Enfant à risque", status:"discuss", doubt:F.unsure, how:"Une dose complémentaire (Prevenar 20) peut être nécessaire : le médecin adaptera le schéma."});
    return sortR(R);
  }

  // ===== 11 ans et plus =====
  // DTP-coqueluche
  if(!F.preg){
    const ms = [11,25,45,65,75,85,95,105];
    const M = ms.filter(x => x <= A).pop(), next = ms.find(x => x > A);
    if(a.dtp === "yes") add({id:"dtp", name:"DTP-coqueluche", dis:"Diphtérie, tétanos, polio, coqueluche", status:"ok", how:`Prochain rappel à ${next} ans.`});
    else add({id:"dtp", name:"DTP-coqueluche", dis:"Diphtérie, tétanos, polio, coqueluche", status:"todo", doubt:doubt("dtp"),
      how: A <= 13 ? "Rappel dTcaP : c'est le bon âge (11–13 ans)." : "1 rappel dTcaP (diphtérie, tétanos, coqueluche, polio).",
      why: "Ensuite, rappels à âge fixe : 25, 45 et 65 ans, puis tous les 10 ans."});
    if(F.l("bebe") && a.dtp === "yes"){
      if(a.coq5 === "yes") add({id:"coq5", name:"Coqueluche", dis:"Entourage du bébé", status:"ok", how:"Vous protégez bien le bébé."});
      else add({id:"coq5", name:"Coqueluche", dis:"Entourage du bébé", status:"todo", doubt:doubt("coq5"), how:"1 rappel dTcaP si la maman n'a pas été vaccinée pendant sa grossesse.", why:"Vaccin à faire au plus tôt, idéalement avant l'arrivée du bébé."});
    }
  } else {
    if(F.stage === "lt20") add({id:"coqpreg", name:"Coqueluche", dis:"Grossesse", status:"later", how:"1 dose de dTcaP à partir de 20 SA (5ᵉ mois), idéalement avant 36 SA.", why:"À refaire à chaque grossesse : vos anticorps protègent le bébé."});
    else if(a.coqpreg === "yes") add({id:"coqpreg", name:"Coqueluche", dis:"Grossesse", status:"ok", how:"Votre bébé sera protégé dès la naissance."});
    else add({id:"coqpreg", name:"Coqueluche", dis:"Grossesse", status:"todo", doubt:doubt("coqpreg"),
      how: F.stage === "37p" ? "À faire au plus vite. Si ce n'est pas possible avant l'accouchement, vous serez vaccinée juste après, avec l'entourage du bébé." : "1 dose de dTcaP maintenant (idéalement entre 20 et 36 SA).",
      why:"À refaire à chaque grossesse."});
  }
  // ROR
  if(A <= 46 || F.l("prosante") || F.l("petiteenfance")){
    const nd = A <= 46 ? "2 doses au total, à au moins 1 mois d'intervalle." : "1 dose.";
    if(a.ror === "yes") add({id:"ror", name:"ROR", dis:"Rougeole, oreillons, rubéole", status:"ok", how:"Protection à vie."});
    else if(F.preg) add({id:"ror", name:"ROR", dis:"Rougeole, oreillons, rubéole", status:"later", live:true, doubt:doubt("ror"), how:"Après l'accouchement : ce vaccin n'est pas fait pendant la grossesse. "+nd});
    else if(F.immuno) add({id:"ror", name:"ROR", dis:"Rougeole, oreillons, rubéole", status:"discuss", live:true, doubt:doubt("ror"), how:"Vaccin vivant : contre-indiqué si l'immunité est affaiblie. À voir avec votre médecin."});
    else if(F.pregMaybe) add({id:"ror", name:"ROR", dis:"Rougeole, oreillons, rubéole", status:"discuss", live:true, doubt:doubt("ror"), how:"À faire une fois la grossesse écartée (test). "+nd});
    else add({id:"ror", name:"ROR", dis:"Rougeole, oreillons, rubéole", status:"todo", live:true, doubt:doubt("ror"), how:nd,
      why: (F.l("prosante")||F.l("petiteenfance")) ? "L'immunité contre la rougeole devient exigée pour les professionnels de santé et de la petite enfance." : ""});
  }
  // HPV
  if(A <= 26){
    const sch = A <= 14 ? "2 doses espacées de 5 à 13 mois." : "3 doses (au départ, à 2 mois et à 6 mois). Rattrapage jusqu'à 26 ans.";
    if(a.hpv === "yes") add({id:"hpv", name:"Papillomavirus (HPV)", dis:"Prévention de cancers", status:"ok", how:"Schéma complet."});
    else if(F.preg) add({id:"hpv", name:"Papillomavirus (HPV)", dis:"Prévention de cancers", status:"later", doubt:doubt("hpv"), how:"Après la grossesse. "+sch});
    else add({id:"hpv", name:"Papillomavirus (HPV)", dis:"Prévention de cancers", status:"todo", doubt:doubt("hpv"), how: a.hpv==="no" ? sch+" Si des doses ont déjà été faites, on complète sans recommencer." : sch});
  }
  // Méningocoques
  if(A <= 24){
    if(a.acwy === "yes") add({id:"acwy", name:"Méningocoques ACWY", dis:"Méningites", status:"ok", how:"À jour."});
    else add({id:"acwy", name:"Méningocoques ACWY", dis:"Méningites", status:"todo", doubt:doubt("acwy"), how: A <= 14 ? "1 dose, entre 11 et 14 ans." : "1 dose de rattrapage (jusqu'à 24 ans)."});
  }
  if(A >= 15 && A <= 24) add({id:"menb", name:"Méningocoque B", dis:"Méningites", status:"discuss", how:"Peut être proposé entre 15 et 24 ans : demandez conseil."});
  // Hépatite B
  {
    const risk = F.c("rein") || F.c("foie") || F.immuno || F.l("prosante");
    if(a.hepb === "yes") add({id:"hepb", name:"Hépatite B", dis:"Foie", status:"ok", how: F.l("prosante") ? "Pensez au contrôle des anticorps avec la médecine du travail." : "Vacciné(e)."});
    else if(risk) add({id:"hepb", name:"Hépatite B", dis:"Foie", status:"todo", doubt:doubt("hepb"),
      how:"3 doses (au départ, à 1 mois, à 6 mois).",
      why: F.l("prosante") ? "Obligatoire pour les professionnels de santé." : "Recommandé en cas de maladie du rein ou du foie, ou d'immunité affaiblie."});
    else add({id:"hepb", name:"Hépatite B", dis:"Foie", status:"discuss", doubt:doubt("hepb"),
      how:"3 doses (au départ, à 1 mois, à 6 mois) si vous êtes exposé(e).",
      why:"Recommandé chez l'adulte dans certaines situations : plusieurs partenaires sexuels, proche porteur du virus, voyages fréquents ou longs dans des pays à risque, usage de drogues, soins réguliers… Parlez-en à un professionnel."});
  }
  // Varicelle
  if(A <= 49 || F.l("prosante") || F.l("petiteenfance") || F.l("fragile")){
    const target = F.l("prosante") || F.l("petiteenfance") || F.l("fragile");
    if(a.vzv === "yes") add({id:"vzv", name:"Varicelle", dis:"Immunité", status:"ok", how:"Déjà eue ou vaccin fait : vous êtes protégé(e)."});
    else if(F.preg) add({id:"vzv", name:"Varicelle", dis:"Immunité", status:"later", live:true, doubt:doubt("vzv"), how:"Après l'accouchement : 2 doses espacées de 1 à 2 mois selon le vaccin (vaccin contre-indiqué pendant la grossesse).", when:"Après l'accouchement"});
    else if(F.immuno) add({id:"vzv", name:"Varicelle", dis:"Immunité", status:"discuss", live:true, doubt:doubt("vzv"), how:"Vaccin vivant : contre-indiqué si l'immunité est affaiblie. À voir avec votre médecin."});
    else if(a.vzv === "unsure") add({id:"vzv", name:"Varicelle", dis:"Immunité", status:"discuss", live:true, doubt:true, how:"Une prise de sang peut vérifier si vous êtes protégé(e). Sinon : 2 doses espacées de 1 à 2 mois selon le vaccin.", why:"Surtout pour les femmes en âge d'avoir des enfants, les professionnels de santé et de la petite enfance, et l'entourage des personnes fragiles."});
    else if(target) add({id:"vzv", name:"Varicelle", dis:"Immunité", status:"todo", live:true, how:"2 doses espacées de 1 à 2 mois selon le vaccin.", why:"Recommandé pour les professionnels de santé et de la petite enfance, et l'entourage des personnes fragiles, sans antécédent de varicelle."});
    else add({id:"vzv", name:"Varicelle", dis:"Immunité", status:"discuss", live:true, how:"2 doses espacées de 1 à 2 mois selon le vaccin, après vérification qu'il n'y a pas de grossesse.", why:"Recommandé notamment aux femmes en âge d'avoir des enfants sans antécédent de varicelle (avec contraception pendant 1 mois après chaque dose)."});
  }
  // Grippe
  if(fluIndicated(s, F)){
    let why = [];
    if(A >= 65) why.push("65 ans et plus");
    if(F.preg) why.push("grossesse");
    if(F.riskFlu && !F.unsure) why.push("votre santé");
    if(F.unsure) why.push("état de santé à préciser");
    if(F.l("ehpad")) why.push("vie en établissement");
    if(F.l("fragile")) why.push("protéger un proche fragile");
    if(F.l("prosante")) why.push("métier de soin");
    if(!why.length && A <= 17) why.push("proposée à tous les 2–17 ans");
    pushSeasonal(add, a, "flu", "Grippe", S, "Pour : "+why.join(", ")+".",
      A >= 65 ? "1 dose chaque automne, de préférence un vaccin renforcé (Efluelda) ou adjuvanté (Fluad)." : (F.preg ? "1 dose, possible à tout moment de la grossesse." : "1 dose chaque automne."));
  }
  // Covid
  if(covidIndicated(s, F)){
    const spring = A >= 80 || F.l("ehpad") || F.immuno;
    pushSeasonal(add, a, "covid", "Covid-19", S,
      F.preg ? "Pendant la grossesse, un vaccin à ARN messager est privilégié." : (spring ? "Une 2ᵉ dose est aussi recommandée au printemps." : ""),
      spring ? "1 dose à l'automne + 1 dose au printemps." : "1 dose chaque automne.");
  }
  // Pneumocoque
  if(A >= 65 || (A >= 18 && F.riskPneumo)){
    const confirmed = ["immuno","asplenie","resp","cardio","rein","foie","diabete"].some(F.c);
    const why = A >= 65 ? "Recommandé pour tous à partir de 65 ans." : (confirmed ? "Recommandé en raison de votre santé." : "Recommandé en cas de maladie chronique : à confirmer avec un professionnel.");
    if(a.pneumo === "yes") add({id:"pneumo", name:"Pneumocoque", dis:"Pneumonies", status:"ok", how:"Une dose suffit : pas de rappel prévu."});
    else if(a.pneumo === "old") add({id:"pneumo", name:"Pneumocoque", dis:"Pneumonies", status:"todo", how:"1 dose de vaccin récent (Capvaxive ou Prevenar 20). Le professionnel vérifiera le délai depuis le précédent vaccin.", why});
    else add({id:"pneumo", name:"Pneumocoque", dis:"Pneumonies", status:"todo", doubt:doubt("pneumo"), how:"1 seule dose (Capvaxive ou Prevenar 20).", why});
  } else if(A < 18 && F.riskPneumo){
    add({id:"pneumo", name:"Pneumocoque", dis:"Adolescent à risque", status:"discuss", doubt:F.unsure, how:"Une dose de Prevenar 20 peut être nécessaire : le médecin adaptera le schéma."});
  }
  // Zona
  if(A >= 65 || (A >= 18 && F.immuno)){
    const why = A >= 65 ? "Recommandé à partir de 65 ans, même après un zona." : "Recommandé dès 18 ans en cas d'immunité affaiblie.";
    if(a.zona === "yes") add({id:"zona", name:"Zona", dis:"Shingrix", status:"ok", how:"Protection complète."});
    else if(a.zona === "one") add({id:"zona", name:"Zona", dis:"Shingrix", status:"todo", how:"2ᵉ dose à faire (au moins 2 mois après la 1ʳᵉ).", why});
    else add({id:"zona", name:"Zona", dis:"Shingrix", status:"todo", doubt:doubt("zona"), how:"2 doses de Shingrix espacées de 2 mois.", why});
  }
  // VRS adulte
  if(A >= 75 || (A >= 65 && F.riskRsv)){
    const why = A >= 75 ? "Recommandé à partir de 75 ans." : (F.unsure ? "Recommandé dès 65 ans en cas de maladie du cœur ou des poumons : à confirmer." : "Recommandé dès 65 ans en cas de maladie du cœur ou des poumons.");
    if(a.rsv === "yes") add({id:"rsv", name:"VRS", dis:"Virus respiratoire syncytial", status:"ok", how:"Une dose : pas de rappel prévu pour l'instant."});
    else add({id:"rsv", name:"VRS", dis:"Virus respiratoire syncytial", status:"todo", doubt:doubt("rsv"), how:"1 dose unique, idéalement avant l'hiver.", why: why+" Vérifiez le remboursement avec votre pharmacien."});
  }
  // VRS grossesse
  if(F.preg){
    const both = "Deux options pour protéger bébé de la bronchiolite : le vaccin Abrysvo pour vous entre 32 et 36 SA, ou l'anticorps Beyfortus pour bébé à la naissance.";
    if(F.stage === "lt20" || F.stage === "20_31") add({id:"rsvpreg", name:"Bronchiolite (VRS)", dis:"Pour votre bébé", status:"later", how:"À décider avant 32 SA.", why:both+" Le vaccin concerne les naissances attendues pendant la saison de la bronchiolite (septembre à janvier)."});
    else if(F.stage === "32_36") add({id:"rsvpreg", name:"Bronchiolite (VRS)", dis:"Pour votre bébé", status:"discuss", how:"C'est le moment de choisir.", why:both});
    else add({id:"rsvpreg", name:"Bronchiolite (VRS)", dis:"Pour votre bébé", status:"discuss", how:"Votre bébé pourra recevoir Beyfortus à la maternité.", why:"Si vous n'avez pas eu le vaccin Abrysvo pendant la grossesse."});
  }
  return sortR(R);
}

function pushSeasonal(add, a, id, name, S, why, how, forceDoubt){
  if(!S.flu){
    add({id, name, dis:"Vaccin de saison", status:"later", how:"À la prochaine campagne d'automne (à partir d'octobre). "+how, why});
  } else if(a[id] === "yes"){
    add({id, name, dis:`Campagne ${S.label}`, status:"ok", how:`Fait depuis le ${S.since}. Rendez-vous à la prochaine campagne.`, why});
  } else if(id === "covid" && a.covidrecent === "yes"){
    const d = a._covidDelay || 6;
    add({id, name, dis:`Campagne ${S.label}`, status:"later", how:`Covid ou vaccin il y a moins de ${d} mois : vaccin à faire ${d} mois après. `+how, why, when:`${d} mois après la dernière infection ou dose`});
  } else {
    add({id, name, dis:`Campagne ${S.label}`, status:"todo", doubt: a[id]==="unsure" || (id==="covid" && a.covidrecent==="unsure") || !!forceDoubt, how, why});
  }
}

function sortR(R){
  const o = {todo:0, later:1, discuss:2, ok:3};
  return R.sort((x,y) => o[x.status]-o[y.status]);
}

// Qui peut vacciner ? Liste fixe de professionnels (même ordre et même présentation pour tous) : pharmacien, médecin, infirmier.
// Pour chaque vaccin à faire : yes | cond (avec condition) | no (avec la raison).
function whoCanVaccinate(s, results){
  const F = flags(s), A = s.age;
  const need = results.filter(r => r.status !== "ok");
  const liveImmuno = r => r.live && F.immuno;
  const LIVE = {v:"cond", why:"uniquement sur ordonnance du médecin (vaccin vivant, immunité affaiblie)"};
  const pro = (id, t, d, rule) => ({id, t, d, items: need.map(r => Object.assign({name:r.name}, rule(r)))});
  return [
    pro("pharma", "Pharmacien",
      A >= 11 ? "Prescrit et vaccine dès 11 ans en pharmacie." : "Délivre les vaccins sur ordonnance, mais ne vaccine pas avant 11 ans.",
      r => A < 11 ? {v:"no", why:"pas de vaccination en pharmacie avant 11 ans"} : (liveImmuno(r) ? LIVE : {v:"yes"})),
    pro("med", A < 18 ? "Médecin (généraliste ou pédiatre)" : "Médecin",
      "Prescrit et vaccine tous les vaccins, à tout âge, y compris dans les situations particulières.",
      r => ({v:"yes"})),
    pro("inf", "Infirmier ou infirmière",
      A >= 11 ? "Prescrit et vaccine dès 11 ans, au cabinet ou à domicile." : "Avant 11 ans : vaccine avec l'ordonnance d'un médecin ou d'une sage-femme.",
      r => liveImmuno(r) ? LIVE : (A < 11 ? {v:"cond", why:"sur ordonnance d'un médecin ou d'une sage-femme"} : {v:"yes"}))
  ];
}

function periodOf(r, s){

let S = fresh();
function fresh(){ return {step:"welcome", who:null, age:null, preg:null, pregStage:null, conds:[], life:[], answers:{}, hist:[]}; }
const NOW = new Date();
const app = document.getElementById("app");

// ---------- flow ----------
function flow(){
  const steps = ["who","age"];
  if(S.age === null) return steps;
  if(S.age >= 18 && S.age <= 49) steps.push("preg");
  if(S.preg === "yes") steps.push("pregStage");
  steps.push("conds");
  if(S.age >= 11) steps.push("life");
  vaccineQuestions(S, NOW).forEach(q => steps.push("v:"+q.id));
  steps.push("result");
  return steps;
}
function go(next){ S.hist.push(S.step); S.step = next; render(); window.scrollTo({top:0}); }
function advance(){
  const f = flow();
  const i = f.indexOf(S.step);
  go(i < 0 ? f[0] : f[i+1] || "result");
}
function back(){ S.step = S.hist.pop() || "welcome"; render(); window.scrollTo({top:0}); }

function progress(){
  const f = flow(); const i = f.indexOf(S.step);
  const total = Math.max(f.length - 1, 1);
  const pct = Math.min(100, Math.round((Math.max(i,0)) / total * 100));
  return `<div aria-hidden="true">
    <div class="syringe"><div class="syr-plunger"></div><div class="syr-rod" style="width:${Math.max(6, 60 - pct*0.54)}px"></div>
      <div class="syr-barrel"><div class="syr-fill" style="width:${pct}%"></div></div><div class="syr-tip"></div><div class="syr-needle"></div></div>
    <div class="step-count">Question ${i+1} sur ${total} environ</div></div>`;
}

function top(showBack){
  return `<header class="top"><div class="brand">${ICONS.shield}<span>VacciRepère</span><span class="adult">Adulte</span><small class="tag">Le bilan de vos vaccins</small></div>
    ${showBack ? '<button class="back" id="back" type="button">← Retour</button>' : ''}</header>`;
}

function optBtn(v, label, cls, ico, small, pressed){
  return `<button class="opt ${cls||''}" type="button" data-v="${v}" aria-pressed="${pressed?'true':'false'}">
    <span class="ico">${ico||''}</span><span class="lbl">${label}${small?`<small>${small}</small>`:''}</span></button>`;
}

// ---------- screens ----------
function render(){
  const st = S.step;
  let h = "";
  if(st === "welcome"){
    h = top(false) + `<section class="screen hero">
      <p class="kicker">Calendrier des vaccinations 2026</p>
      <h1>Quels vaccins <em>pour moi</em>&nbsp;?</h1>
      <p class="sub">Répondez à quelques questions : votre âge, votre santé, les vaccins déjà faits. Vous saurez ensuite quels vaccins faire et qui peut vous vacciner.</p>
      <p class="facts-line"><span>Adultes, dès 18 ans</span><span>2 minutes</span><span>Anonyme</span><span>Rien n'est enregistré</span></p>
      <button class="cta" id="start" type="button">C'est parti <span aria-hidden="true">→</span></button>
      <div class="hero-foot">
        <p class="source">Recommandations élaborées à partir du <a href="https://sante.gouv.fr/prevention-en-sante/preserver-sa-sante/vaccination/calendrier-vaccinal">calendrier vaccinal mis à jour en 2026</a> (ministère chargé de la Santé).</p>
        <p class="mention-light"><b>Mention légale.</b> Ce site est un site d'information. Les vaccins doivent être prescrits par un professionnel de santé (médecin, sage-femme, pharmacien ou infirmier habilité). Aucune information fournie ici ne remplace l'avis d'un professionnel de santé.</p>
      </div>
      <section class="brandkit" aria-labelledby="bk-t">
        <h2 id="bk-t" class="bk-title">Logos de l'application</h2>
        <div class="bk-grid">
          <figure class="bk-item"><div class="bk-img sq"><img src="${LOGOS.icone.src}" alt="Icône VacciRepère Adulte : bouclier et seringue"></div>
            <figcaption><span>${LOGOS.icone.label}</span><button class="bk-dl" type="button" data-logo="icone">Télécharger</button></figcaption></figure>
          <figure class="bk-item"><div class="bk-img sq"><img src="${LOGOS.complet.src}" alt="Logo carré VacciRepère Adulte"></div>
            <figcaption><span>${LOGOS.complet.label}</span><button class="bk-dl" type="button" data-logo="complet">Télécharger</button></figcaption></figure>
          <figure class="bk-item wide"><div class="bk-img white"><img src="${LOGOS.horiz.src}" alt="Logo horizontal VacciRepère Adulte"></div>
            <figcaption><span>${LOGOS.horiz.label}</span><button class="bk-dl" type="button" data-logo="horiz">Télécharger</button></figcaption></figure>
        </div>
        <p class="fine" id="bk-note"></p>
      </section>
    </section>`;
  }
  else if(st === "who"){
    h = top(true) + progress() + `<section class="screen">
      <h2 class="q">Pour qui faites-vous le test&nbsp;?</h2>
      <div class="opts">
        ${optBtn("moi","Pour moi","", ICONS.me, "", S.who==="moi")}
        ${optBtn("proche","Pour un proche adulte","", ICONS.other, "un parent, un conjoint…", S.who==="proche")}
      </div></section>`;
  }
  else if(st === "age"){
    const P = pron(S);
    const min = 18, max = 105;
    if(S.age === null || S.age < min || S.age > max) S.age = S.who === "moi" ? 40 : 70;
    h = top(true) + progress() + `<section class="screen">
      <h2 class="q">${P.age}</h2>
      <div class="age">
        <div class="age-row">
          <button class="age-btn" id="minus" type="button" aria-label="Retirer un an">−</button>
          <div class="age-val" id="ageval" aria-live="polite"></div>
          <button class="age-btn" id="plus" type="button" aria-label="Ajouter un an">+</button>
        </div>
        <label class="fine" for="agerange">Glissez pour aller plus vite</label>
        <input type="range" id="agerange" min="${min}" max="${max}" value="${S.age}">
      </div>
      <button class="cta" id="next" type="button">Valider <span aria-hidden="true">→</span></button>
    </section>`;
  }
  else if(st === "preg"){
    const P = pron(S);
    h = top(true) + progress() + `<section class="screen">
      <h2 class="q">${S.who==="moi" ? "Êtes-vous enceinte&nbsp;?" : "Votre proche est-elle enceinte&nbsp;?"}</h2>
      <p class="sub">Certains vaccins protègent le bébé pendant la grossesse, d'autres attendent l'accouchement.</p>
      <div class="opts">
        ${optBtn("yes","Oui","", ICONS.baby, "", S.preg==="yes")}
        ${optBtn("no","Non, ou pas concernée","no", ICONS.no, "", S.preg==="no")}
        ${optBtn("maybe","Peut-être","unsure", ICONS.unsure, "un test est en cours ou prévu", S.preg==="maybe")}
      </div></section>`;
  }
  else if(st === "pregStage"){
    h = top(true) + progress() + `<section class="screen">
      <h2 class="q">À quel stade de la grossesse&nbsp;?</h2>
      <p class="sub">SA = semaines d'aménorrhée, le terme utilisé par la sage-femme et le médecin.</p>
      <div class="opts">
        ${optBtn("lt20","Moins de 20 SA","", "<b>1–4</b>", "jusqu'à 4 mois et demi", S.pregStage==="lt20")}
        ${optBtn("20_31","De 20 à 31 SA","", "<b>5–7</b>", "du 5ᵉ au 7ᵉ mois", S.pregStage==="20_31")}
        ${optBtn("32_36","De 32 à 36 SA","", "<b>8</b>", "le 8ᵉ mois", S.pregStage==="32_36")}
        ${optBtn("37p","37 SA ou plus","", "<b>9</b>", "le 9ᵉ mois", S.pregStage==="37p")}
      </div></section>`;
  }
  else if(st === "conds"){
    const me = S.who === "moi";
    h = top(true) + progress() + `<section class="screen">
      <h2 class="q">${me ? "Avez-vous l'une de ces maladies&nbsp;?" : (S.who==="enfant" ? "Votre enfant a-t-il l'une de ces maladies&nbsp;?" : "Votre proche a-t-il l'une de ces maladies&nbsp;?")}</h2>
      <p class="sub">Cochez tout ce qui s'applique. Certaines maladies rendent les infections plus graves : des vaccins sont alors recommandés plus tôt.</p>
      <div class="chips" id="chips">
        ${CONDS.map(c => chip(c.k, c.t, c.s, S.conds.includes(c.k))).join("")}
        ${chip("none", "Aucune de ces maladies", "", S.conds.includes("none"))}
      </div>
      <button class="cta" id="next" type="button" ${S.conds.length?'':'disabled'}>Continuer <span aria-hidden="true">→</span></button>
    </section>`;
  }
  else if(st === "life"){
    const list = LIFE.filter(x => S.who !== "enfant" || !x.adult);
    h = top(true) + progress() + `<section class="screen">
      <h2 class="q">${S.who==="moi" ? "Et dans votre quotidien&nbsp;?" : "Et dans son quotidien&nbsp;?"}</h2>
      <p class="sub">Votre entourage et votre métier comptent aussi : on se vaccine parfois pour protéger les autres.</p>
      <div class="chips" id="chips">
        ${list.map(c => chip(c.k, S.who==="moi" ? c.t.replace("Vit ","Je vis ").replace("Travaille","Je travaille") : c.t, c.s||"", S.life.includes(c.k))).join("")}
        ${chip("none", "Aucune de ces situations", "", S.life.includes("none"))}
      </div>
      <button class="cta" id="next" type="button" ${S.life.length?'':'disabled'}>Continuer <span aria-hidden="true">→</span></button>
    </section>`;
  }
  else if(st.startsWith("v:")){
    const id = st.slice(2);
    const q = vaccineQuestions(S, NOW).find(x => x.id === id);
    if(!q){ advance(); return; }
    const cur = S.answers[id];
    h = top(true) + progress() + `<section class="screen">
      ${q.group ? `<p class="kicker">${q.group}</p>` : ""}
      <div class="visa"><span style="color:var(--blue)">${ICONS.vial}</span><div><div class="vname">${q.vac}</div><div class="vdis">${q.dis}</div></div></div>
      <h2 class="q">${q.q.replace(/ \?$/,"&nbsp;?")}</h2>
      ${q.sub ? `<p class="sub">${q.sub}</p>` : ""}
      <div class="opts">${q.opts.map(o => optBtn(o.v, o.label, o.cls, ICONS[o.cls]||"", o.small||"", cur===o.v)).join("")}</div>
      <p class="fine">Pas de carnet sous la main ? Choisissez « Je ne sais pas » : dans le doute, on vaccine. Une dose de plus ne pose pas de problème.</p>
    </section>`;
  }
  else if(st === "result"){
    h = top(true) + resultHTML();
  }
  else if(st === "fiche"){
    h = top(true) + ficheHTML();
  }
  app.innerHTML = h;
  bind();
}

function chip(k, t, s, on){
  return `<button class="chip" type="button" data-k="${k}" aria-pressed="${on?'true':'false'}"><span class="box">${on?'✓':''}</span><span><b>${t}</b>${s?`<small>${s}</small>`:''}</span></button>`;
}

function resultHTML(){
  const R = computeResults(S, NOW);
  const cnt = st => R.filter(r => r.status === st).length;
  const P = pron(S);
  const me = S.who === "moi";
  const groups = [
    {st:"todo", t:"À faire", stamp:"À faire", cls:"t-todo"},
    {st:"later", t:"À prévoir", stamp:"Bientôt", cls:"t-later"},
    {st:"discuss", t:"À discuter avec un professionnel", stamp:"À discuter", cls:"t-discuss"},
    {st:"ok", t:"Déjà à jour", stamp:"À jour", cls:"t-ok"}
  ];
  let d = 0;
  const card = r => {
    d += 0.12;
    const g = groups.find(x => x.st === r.status);
    if(r.status === "ok") return `<article class="vcard ok" style="--d:${d.toFixed(2)}s">
      <div class="vrow"><h3>${r.name}</h3><span class="stamp">${g.stamp}</span></div>
      <p class="how small">${r.how}</p></article>`;
    const when = periodOf(r, S);
    return `<article class="vcard ${r.status}" style="--d:${d.toFixed(2)}s">
      <div class="vrow"><h3>${r.name}</h3><span class="stamp">${g.stamp}</span></div>
      <p class="benefit">${benefitOf(r)}</p>
      <p class="how"><span class="lbl">Schéma</span>${r.how}</p>
      ${when ? `<p class="when"><span class="lbl">Quand</span>${when}</p>` : ""}
      ${r.why ? `<p class="why">${r.why}</p>` : ""}
      ${r.doubt ? `<span class="doubt">Dans le doute, on vaccine</span>` : ""}
    </article>`;
  };
  const todo = cnt("todo");
  let head = `<section class="screen slam">
    <div class="res-head">
      <p class="kicker">Votre bilan est prêt</p>
      <h2>${todo ? (todo === 1 ? "1 vaccin à faire" : todo + " vaccins à faire") : "Bravo, tout est à jour pour l'instant"}</h2>
      <div class="tally">
        ${groups.filter(g => cnt(g.st)).map(g => `<span class="tal ${g.cls}"><b>${cnt(g.st)}</b> ${g.t.split(" avec")[0].toLowerCase()}</span>`).join("")}
      </div>
    </div>`;
  head += `<p class="caution" role="note"><b>Attention :</b> certaines situations particulières (maladies rares ou traitements spécifiques, activités professionnelles, voyages) ne sont pas couvertes par cet outil. Parlez-en à votre équipe médicale.</p>`;
  if(!todo) head += `<div class="cheer">Bien joué&nbsp;! Gardez votre carnet à jour et revenez à chaque anniversaire de rappel.</div>`;
  groups.forEach(g => {
    const list = R.filter(r => r.status === g.st);
    if(!list.length) return;
    head += `<h3 class="section-title ${g.cls}"><span class="dot"></span>${g.t}<span class="cnt">${list.length}</span></h3><div class="cards">${list.map(card).join("")}</div>`;
  });

  // where
  const pros = whoCanVaccinate(S, R);
  const needNames = R.filter(r => r.status !== "ok").map(r => r.name);
  if(needNames.length){
    head += `<h3 class="section-title"><span class="dot" style="background:var(--blue)"></span>Où ${me ? "me" : "se"} faire vacciner&nbsp;?</h3>
      <p class="sub">Tous ces professionnels peuvent vous accompagner. Chaque carte indique, pour chaque vaccin de votre liste, s\'il peut le faire et sinon pourquoi.</p>
      <div class="where">${pros.map(p => {
        const yes = p.items.filter(i => i.v !== "no").length;
        return `<div class="pro">
        <div class="pico">${ICONS[p.id]||ICONS.centre}</div>
        <h4>${p.t}</h4>
        <p>${p.d}</p>
        <p class="pcount">${yes} vaccin${yes>1?"s":""} sur ${p.items.length} de votre liste</p>
        <ul class="plist">${p.items.map(i => `<li class="${i.v}"><span class="mk" aria-hidden="true">${i.v==="no" ? "✕" : "✓"}</span><span><b>${i.name}</b>${i.v==="no" ? ` : <span class="sr">non</span>${i.why}` : (i.v==="cond" ? ` : ${i.why}` : "")}</span></li>`).join("")}</ul>
      </div>`;}).join("")}</div>
      <p class="others">D'autres professionnels, comme les médecins spécialistes et les sages-femmes, ou certaines structures, comme les centres de vaccination, peuvent aussi vous vacciner. N'hésitez pas à vous renseigner auprès de votre équipe médicale.</p>`;
    const tips = [];
    if(S.age >= 11 && R.some(r => r.id==="flu" && r.status==="todo")) tips.push("<b>Grippe :</b> depuis juillet 2026, le vaccin se délivre sur prescription. Dès 11 ans, le pharmacien ou l'infirmier la rédige sur place.");
    tips.push("<b>Le jour J :</b> apportez votre carnet de santé ou ouvrez le carnet de vaccination de Mon espace santé. Plusieurs vaccins peuvent souvent être faits le même jour.");
    if(R.some(r => r.live && r.status!=="ok") && flags(S).immuno) tips.push("<b>Immunité affaiblie :</b> les vaccins vivants (comme le ROR) sont décidés uniquement avec votre médecin.");
    if(S.life.includes("prosante") || S.life.includes("petiteenfance")) tips.push("<b>Vaccins liés à votre métier :</b> la médecine du travail peut aussi les faire (hépatite B, ROR, coqueluche, grippe).");
    if(S.age >= 11) tips.push("<b>Pharmaciens et infirmiers :</b> ceux qui vaccinent ont suivi une formation spécifique ; renseignez-vous auprès de votre pharmacie ou de votre cabinet.");
    if(S.age >= 18) tips.push("<b>Remboursement :</b> la plupart des vaccins recommandés sont pris en charge par l'Assurance Maladie et la mutuelle. Demandez au professionnel.");
    head += tips.map(t => `<p class="tip">${t}</p>`).join("");
  }

  head += `<button class="cta fiche-cta" id="fiche" type="button">Ma fiche de synthèse à partager <span aria-hidden="true">→</span></button>
    <div class="actions">
      <button class="ghost" id="copy" type="button">Copier ma liste</button>
      <button class="ghost" id="restart" type="button">Refaire le test</button>
    </div>
    <p class="source">Recommandations élaborées à partir du <a href="https://sante.gouv.fr/prevention-en-sante/preserver-sa-sante/vaccination/calendrier-vaccinal">calendrier vaccinal mis à jour en 2026</a> (ministère chargé de la Santé).</p>
    <div class="mention" role="note">
      <b>Mention légale</b>
      <p>Ce site est un site d'information. Les vaccins doivent être prescrits par un professionnel de santé (médecin, sage-femme, pharmacien ou infirmier habilité). Aucune information fournie ici ne remplace l'avis d'un professionnel de santé.</p>
    </div>
    <div class="legal">
      <p>Le professionnel de santé tiendra compte de votre dossier complet (allergies, traitements, voyages…).</p>
      <p>En savoir plus : <a href="https://vaccination-info-service.fr">vaccination-info-service.fr</a></p>
    </div>
  </section>`;
  return head;
}

function ficheData(){
  const R = computeResults(S, NOW);
  const condLabels = S.conds.includes("unsure") ? ["Ne sait pas (à préciser avec un professionnel)"] :
    S.conds.includes("none") ? [] : S.conds.map(k => (CONDS.find(c => c.k === k)||{}).t).filter(Boolean);
  const lifeLabels = S.life.filter(k => k !== "none").map(k => (LIFE.find(c => c.k === k)||{}).t).filter(Boolean);
  let profil = (S.who==="moi" ? "Patient" : (S.who==="enfant" ? "Enfant" : "Proche")) + " · " + (S.age === 0 ? "moins d'1 an" : S.age + " ans");
  if(S.preg === "yes"){ const st = {lt20:"moins de 20 SA","20_31":"20 à 31 SA","32_36":"32 à 36 SA","37p":"37 SA ou plus"}[S.pregStage]; profil += " · enceinte (" + st + ")"; }
  if(S.preg === "maybe") profil += " · grossesse possible";
  const row = r => ({name:r.name, how:r.how, when:periodOf(r, S), doubt:r.doubt, st:r.status});
  return {
    nom: S.nom || "", profil, condLabels, lifeLabels,
    ok: R.filter(r => r.status === "ok").map(row),
    todo: R.filter(r => r.status === "todo" || r.status === "later").map(row),
    discuss: R.filter(r => r.status === "discuss").map(row),
    date: NOW.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"})
  };
}

const pdfSafe = t => String(t).replace(/ᵉ/g,"e").replace(/ʳ/g,"r").replace(/[→←↓]/g,"-").replace(/\u202f|\u00a0/g," ");

function buildPDF(){
  const D = ficheData();
  const { jsPDF } = window.jspdf;
  const W = 210, H = 297, M = 14, CW = W - 2*M;
  function layout(doc, fs, draw){
    let y = 0;
    const lh = fs * 0.42;
    // header
    if(draw){ doc.setFillColor(0,0,145); doc.rect(0,0,W,22,"F"); doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Fiche de synthèse vaccinale", M, 12); doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text("VacciRepère Adulte", M, 18); doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text(pdfSafe(D.date), W-M, 14, {align:"right"}); }
    y = 30;
    const text = (t, opt) => { opt = opt||{}; doc.setFont("helvetica", opt.bold?"bold":"normal"); doc.setFontSize(opt.size||fs);
      const lines = doc.splitTextToSize(pdfSafe(t), opt.w || CW);
      if(draw){ const c = opt.color||[22,22,22]; doc.setTextColor(c[0],c[1],c[2]); doc.text(lines, opt.x||M, y); }
      y += lines.length * (opt.size||fs) * 0.42 + (opt.after||1.5); };
    const section = t => { y += 2; if(draw){ doc.setTextColor(0,0,145); doc.setFont("helvetica","bold"); doc.setFontSize(fs+1); doc.text(t.toUpperCase(), M, y); doc.setDrawColor(0,0,145); doc.setLineWidth(.5); doc.line(M, y+1.5, W-M, y+1.5);} y += lh + 4; };
    const table = (rows, ok) => {
      if(!rows.length){ text("Aucun."); return; }
      const c1 = CW*0.28, c3 = CW*0.27, c2 = CW - c1 - c3;
      rows.forEach(r => {
        doc.setFontSize(fs);
        doc.setFont("helvetica","bold"); const a = doc.splitTextToSize(pdfSafe(r.name + (r.doubt?" *":"")), c1-3);
        doc.setFont("helvetica","normal"); const b = doc.splitTextToSize(pdfSafe(r.how), c2-3);
        doc.setFont("helvetica","bold"); const c = doc.splitTextToSize(pdfSafe(r.when || "À jour"), c3-2);
        const n = Math.max(a.length, b.length, c.length), hgt = n*lh + 2.5;
        if(draw){
          const col = ok ? [24,117,60] : (r.st === "discuss" ? [179,64,0] : [225,0,15]);
          doc.setFillColor(col[0],col[1],col[2]); doc.rect(M, y-lh+0.3, 1.2, n*lh+0.6, "F");
          doc.setTextColor(22,22,22); doc.setFont("helvetica","bold"); doc.text(a, M+3, y);
          doc.setFont("helvetica","normal"); doc.text(b, M+c1, y);
          doc.setTextColor(col[0],col[1],col[2]); doc.setFont("helvetica","bold"); doc.text(c, M+c1+c2, y);
          doc.setDrawColor(225,225,225); doc.setLineWidth(.2); doc.line(M, y+n*lh-lh+2, W-M, y+n*lh-lh+2);
        }
        y += hgt;
      });
    };
    text(D.nom || "Nom : ..............................................", {bold:true, size:fs+2, after:1});
    text(D.profil, {after:2});
    section("Situation de santé déclarée");
    text("Maladies : " + (D.condLabels.length ? D.condLabels.join(", ") : "aucune maladie déclarée"));
    if(D.lifeLabels.length) text("Situations : " + D.lifeLabels.join(", "));
    section("Vaccinations à jour"); table(D.ok, true);
    section("Vaccinations à faire"); table(D.todo, false);
    if(D.discuss.length){ section("À discuter avec un professionnel"); table(D.discuss, false); }
    y += 3;
    const foot = (D.todo.concat(D.discuss).some(r => r.doubt) ? "* Statut incertain déclaré par le patient : la vaccination est recommandée dans le doute. " : "") +
      "Fiche établie à partir des déclarations du patient, non vérifiées. Certaines situations particulières (maladies rares ou traitements spécifiques, activités professionnelles, voyages) ne sont pas couvertes par cet outil. Recommandations élaborées à partir du calendrier vaccinal mis à jour en 2026 (ministère chargé de la Santé). Site d'information : les vaccins doivent être prescrits par un professionnel de santé ; aucune information fournie ne remplace l'avis d'un professionnel de santé.";
    if(draw){ doc.setDrawColor(200,200,200); doc.line(M, y-2, W-M, y-2); }
    text(foot, {size:Math.max(6.5, fs-2), color:[80,80,80]});
    return y;
  }
  let fs = 10.5;
  const probe = new jsPDF({unit:"mm", format:"a4"});
  while(fs > 6.5 && layout(probe, fs, false) > H - 10) fs -= 0.5;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  layout(doc, fs, true);
  return doc.output("blob");
}

function ficheText(){
  const D = ficheData();
  const L = r => `- ${r.name}${r.doubt ? " (*)" : ""} : ${r.how}${r.when ? " → " + r.when : ""}`;
  let t = `FICHE DE SYNTHÈSE VACCINALE (VacciRepère Adulte) – ${D.date}\n${D.nom ? D.nom + "\n" : ""}${D.profil}\n\nSITUATION DE SANTÉ DÉCLARÉE\nMaladies : ${D.condLabels.length ? D.condLabels.join(", ") : "aucune maladie déclarée"}\n`;
  if(D.lifeLabels.length) t += `Situations : ${D.lifeLabels.join(", ")}\n`;
  t += `\nVACCINATIONS À JOUR\n${D.ok.length ? D.ok.map(r => "- " + r.name).join("\n") : "Aucune"}\n`;
  t += `\nVACCINATIONS À FAIRE\n${D.todo.length ? D.todo.map(L).join("\n") : "Aucune"}\n`;
  if(D.discuss.length) t += `\nÀ DISCUTER\n${D.discuss.map(L).join("\n")}\n`;
  if(D.todo.concat(D.discuss).some(r => r.doubt)) t += `\n(*) Statut incertain déclaré par le patient : vaccination recommandée dans le doute.`;
  return t + `\n\nFiche établie à partir de mes déclarations (non vérifiées), selon le calendrier vaccinal 2026. Merci de me dire quels vaccins vous pouvez me prescrire ou me faire.`;
}

function summaryText(){
  const R = computeResults(S, NOW);
  const lab = {todo:"À FAIRE", later:"À PRÉVOIR", discuss:"À DISCUTER", ok:"À JOUR"};
  const P = S.who==="moi" ? "Moi" : (S.who==="enfant" ? "Mon enfant" : "Mon proche");
  let t = `VacciRepère Adulte – mon bilan vaccins (${P}, ${S.age === 0 ? "moins d'1 an" : S.age + " ans"})\n`;
  ["todo","later","discuss","ok"].forEach(st => {
    const l = R.filter(r => r.status === st); if(!l.length) return;
    t += `\n${lab[st]}\n` + l.map(r => `- ${r.name} : ${r.how}${r.doubt ? " (dans le doute)" : ""}`).join("\n") + "\n";
  });
  return t + "\nCalendrier des vaccinations 2026 – à valider avec un professionnel de santé.";
}

// ---------- events ----------
function bind(){
  const $ = id => document.getElementById(id);
  $("back") && ($("back").onclick = back);
  $("start") && ($("start").onclick = () => go("who"));
  app.querySelectorAll(".bk-dl").forEach(btn => btn.onclick = async () => {
    const L = LOGOS[btn.dataset.logo], note = $("bk-note");
    try{
      const blob = await (await fetch(L.src)).blob();
      let dl = null;
      try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
      if(dl){ await dl.save({filename:L.file, data:blob}); note.textContent = "Logo enregistré."; }
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = L.file; document.body.appendChild(a); a.click(); a.remove(); }
    }catch(e){ note.textContent = e && e.code === "declined" ? "Téléchargement annulé." : "Téléchargement impossible ici : appui long sur l'image pour l'enregistrer."; }
  });
  const st = S.step;
  if(st === "who") app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(S.who !== b.dataset.v){ S.age = null; S.preg = null; S.pregStage = null; S.life = []; S.answers = {}; }
    S.who = b.dataset.v; advance(); });
  if(st === "age"){
    const show = () => { $("ageval").innerHTML = S.age === 0 ? `0<small>moins d'1 an</small>` : `${S.age}<small>${S.age>1?"ans":"an"}</small>`; $("agerange").value = S.age; };
    const min = +$("agerange").min, max = +$("agerange").max;
    show();
    $("minus").onclick = () => { S.age = Math.max(min, S.age-1); show(); };
    $("plus").onclick = () => { S.age = Math.min(max, S.age+1); show(); };
    $("agerange").oninput = e => { S.age = +e.target.value; show(); };
    $("next").onclick = () => {
      if(!(S.age >= 18 && S.age <= 49)){ S.preg = null; S.pregStage = null; }
      S.answers = {}; advance(); };
  }
  if(st === "preg") app.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.preg = b.dataset.v; if(S.preg!=="yes") S.pregStage = null; advance(); });
  if(st === "pregStage") app.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.pregStage = b.dataset.v; advance(); });
  if(st === "conds" || st === "life"){
    const key = st === "conds" ? "conds" : "life";
    const excl = st === "conds" ? ["none","unsure"] : ["none"];
    app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      const k = b.dataset.k; let arr = S[key];
      if(arr.includes(k)) arr = arr.filter(x => x !== k);
      else if(excl.includes(k)) arr = [k];
      else arr = arr.filter(x => !excl.includes(x)).concat(k);
      S[key] = arr;
      app.querySelectorAll(".chip").forEach(c => { const on = arr.includes(c.dataset.k); c.setAttribute("aria-pressed", on); c.querySelector(".box").textContent = on ? "✓" : ""; });
      $("next").disabled = !arr.length;
    });
    $("next").onclick = advance;
  }
  if(st.startsWith("v:")) app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    S.answers[st.slice(2)] = b.dataset.v;
    b.setAttribute("aria-pressed","true");
    setTimeout(advance, 140);
  });
  if(st === "fiche"){
    $("toresult").onclick = () => { S.step = "result"; render(); window.scrollTo({top:0}); };
    $("nom").oninput = e => { S.nom = e.target.value.slice(0,80); $("sh-nom").textContent = S.nom || "Nom : ………………………………"; };
    $("copyfiche").onclick = async () => {
      try{ await navigator.clipboard.writeText(ficheText()); toast("Fiche copiée."); }
      catch(e){ toast("Copie impossible : faites une capture d'écran de la fiche."); }
    };
    const note = $("pdfnote");
    $("pdf").onclick = async () => {
      if(!window.jspdf){ note.textContent = "Le PDF n'a pas pu être préparé. Faites une capture d'écran de la fiche."; return; }
      let dl = null;
      try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ dl = null; }
      const blob = buildPDF();
      const name = "fiche-vaccins-" + NOW.toISOString().slice(0,10) + ".pdf";
      if(dl){
        try{ await dl.save({filename:name, data:blob}); note.textContent = "Fiche enregistrée."; }
        catch(e){ note.textContent = e && e.code === "declined" ? "Téléchargement annulé." : "Téléchargement impossible ici : faites une capture d'écran de la fiche."; }
      } else {
        try{ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); note.textContent = "Si rien ne se passe, faites une capture d'écran de la fiche."; }
        catch(e){ note.textContent = "Téléchargement impossible ici : faites une capture d'écran de la fiche."; }
      }
    };
  }
  if(st === "result"){
    $("fiche").onclick = () => go("fiche");
    $("restart").onclick = () => { S = fresh(); render(); window.scrollTo({top:0}); };
    $("copy").onclick = async () => {
      try{ await navigator.clipboard.writeText(summaryText()); toast("Liste copiée : collez-la dans un message ou une note."); }
      catch(e){ toast("Copie impossible sur cet appareil : faites une capture d'écran."); }
    };
  }
  try{ window.claude?.hot?.snapshot?.(() => S); }catch(e){}
}

function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }

function start(data){
  if(data && data.step){ S = Object.assign(fresh(), data); }
  render();
}
try{ window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}); }
catch(e){ start({}); }
})();
</script>
